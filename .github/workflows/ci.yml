name: offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Byte-compile the host tools
        run: python3 -m py_compile tools/*.py tools/legacy/*.py
      - name: Offline tool tests (stub device, no USB)
        run: python3 tools/tests/test_offline.py
      - name: Documentation guard
        run: python3 tools/docs_audit.py
